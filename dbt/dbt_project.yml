name: 'airbnb_dw'
version: '1.0.0'
config-version: 2

profile: 'airbnb_dw'

model-paths: ["models"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
macro-paths: ["macros"]
docs-paths: ["docs"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  airbnb_dw:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: gold
    monitoring:
      +materialized: table
      +schema: monitoring