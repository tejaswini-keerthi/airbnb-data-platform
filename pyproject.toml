[project]
name = "airbnb-data-platform"
version = "0.1.0"
description = "Production-grade batch ELT pipeline with medallion architecture and SCD Type 2"
requires-python = ">=3.11"
dependencies = [
    "pyspark>=3.5.0",
    "boto3>=1.34.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]